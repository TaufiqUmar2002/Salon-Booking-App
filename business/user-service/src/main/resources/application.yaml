server:
  port: 7002

spring:
  application:
    name: USER-SERVICE

  devtools:
    add-properties: true

  datasource:
    url: jdbc:mysql://localhost:6003/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: app_user
    password: app_password
    driver-class-name: com.mysql.cj.jdbc.Driver

#  datasource:
#    url: mysql://localhost:3306/mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
##    url: jdbc:mysql://mysql-db:3306/app_db
#    username: app_user
#    password: app_password
#    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379


eureka:
  instance:
    prefer-ip-address : true
  client:
    fetch-registry : true
    register-with-eureka : true
    service-url:
      defaultZone : http://localhost:4001/eureka/


logging:
  level:
    org.springframework.cache: TRACE

