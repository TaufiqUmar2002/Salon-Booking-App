server:
  port: 7006

spring:
  application:
    name: BOOKING-SERVICE

  devtools:
    add-properties: true

  datasource:
    url: jdbc:mysql://localhost:6003/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: app_user
    password: app_password
    driver-class-name: com.mysql.cj.jdbc.Driver
#  datasource:
#    url: jdbc:mysql://mysql-db:3306/app_db
#    username: app_user
#    password: app_password
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      api-key: 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
      base-url: https://integrate.api.nvidia.com
      chat:
        options:
          model: nvidia/llama-3.3-nemotron-super-49b-v1

eureka:
  instance:
    prefer-ip-address : true
  client:
    fetch-registry : true
    register-with-eureka : true
    service-url:
      defaultZone : http://localhost:4001/eureka/


logging:
  level:
    org.springframework.cache: TRACE

