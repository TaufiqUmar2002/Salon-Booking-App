server:
  port: 5006

spring:
  application:
    name: AI-RECOMMENDATION-SERVICE

  devtools:
    add-properties: true

  datasource:
    url: jdbc:postgresql://postgres-db:5432/app_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:4001/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
