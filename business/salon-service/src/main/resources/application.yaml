server.port: 5009

spring:
  application:
    name: SALON-SERVICE
  devtools:
    add-properties: true


  ai:
    openai:
      api-key: {API_KEY}
      base-url: https://integrate.api.nvidia.com
      chat:
        options:
          model: nvidia/llama-3.3-nemotron-super-49b-v1

  datasource:
    url: jdbc:postgresql://localhost:6001/app_db?options=-c%20TimeZone=UTC
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
#  datasource:
#    url: jdbc:postgresql://postgres-db:5432/app_db
#    username: admin
#    password: admin
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address : true
  client:
    fetch-registry : true
    register-with-eureka : true
    service-url:
      defaultZone : http://localhost:4001/eureka/


logging:
  level:
    org.springframework.cache: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.models: DEBUG


